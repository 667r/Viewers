name: Deploy OHIF Viewer to GitHub Pages

on:
  push:
    branches:
      - mrliverSegmentation

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Yarn globalmente
        run: npm install -g yarn@1.22.22

      - name: Instalar dependencias raíz
        run: bun install --frozen-lockfile

      - name: Construir OHIF Viewer para producción
        run: bun run build:ci
        env:
          PUBLIC_URL: /Viewers/

      - name: Duplicar index.html como 404.html para el ruteo de la SPA
        run: cp platform/app/dist/index.html platform/app/dist/404.html

      - name: Configurar Pages estático
        uses: actions/configure-pages@v5

      - name: Subir el build como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: platform/app/dist

      - name: Desplegar en GitHub Pages directamente
        id: deployment
        uses: actions/deploy-pages@v4
