name: Deploy OHIF Viewer to GitHub Pages

on:
  push:
    branches: [mrLiverSegmentation]

permissions:
  contents: write

concurrency:
  group: deploy-viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Yarn globalmente
        run: npm install -g yarn@1.22.22

      - name: Instalar dependencias raíz
        run: bun install --frozen-lockfile

      - name: Construir OHIF Viewer para producción
        run: bun run build:ci
        env:
          PUBLIC_URL: /Viewers/

      - name: Duplicar index.html como 404.html para el ruteo de la SPA
        run: cp platform/app/dist/index.html platform/app/dist/404.html

      - name: Crear archivo .nojekyll
        run: touch platform/app/dist/.nojekyll

      - name: Desplegar a GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: platform/app/dist
          branch: gh-pages # 🚀 Subirá los archivos compilados a esta rama independiente
          clean: true
